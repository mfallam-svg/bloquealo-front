<header class="main-header">
  <div class="header-container">
    <div class="logo-area">
      <img src="images/gob-pe.png" alt="gob.pe" class="gob-pe-logo" onerror="this.style.display='none'">
      <div class="vertical-separator"></div>
      <span class="service-name">Servicio Bloquéalo</span>
    </div>
    
  </div>
</header>

<main class="home-main">
  
  <section class="hero-section">
    <div class="bg-waves"></div>
    
    <div class="hero-content facial-hero-content fade-in">
      <h1>Reconocimiento facial</h1>
      <p class="hero-subtitle">Verifique su identidad mirando al frente</p>
      
      <p class="hero-small-text" *ngIf="scanState === 'idle'">Ubique su rostro dentro del círculo</p>
      <p class="hero-small-text" *ngIf="scanState === 'scanning'">Mantenga buena iluminación...</p>
      <p class="hero-small-text success-text fade-in" *ngIf="scanState === 'success'">¡Identidad verificada exitosamente!</p>
    </div>
  </section>
  
  <section class="verification-card-container">
    <div class="facial-view-container fade-in">
      <div class="facial-card">
        
        
        <div class="scanner-oval" [class.success]="scanState === 'success'">
          
          <div class="grid-bg" *ngIf="scanState !== 'success'"></div>

          <ng-container *ngIf="scanState !== 'success'">
            <svg class="face-silhouette" viewBox="0 0 24 24" fill="none" stroke="#4A505C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <div class="scanner-brackets">
              <span class="tl"></span><span class="tr"></span>
              <span class="bl"></span><span class="br"></span>
            </div>
            <div class="scan-line" *ngIf="scanState === 'scanning'"></div>
          </ng-container>

          
          <div class="success-icon-wrapper" *ngIf="scanState === 'success'">
            <svg viewBox="0 0 24 24" fill="none" stroke="#DC362E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="M9 12l2 2 4-4"></path>
            </svg>
          </div>

        </div>
      </div>

      <button class="btn-red-full" *ngIf="scanState === 'idle'" (click)="iniciarVerificacion()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
          <path d="M4 7V4h3"></path><path d="M4 17v3h3"></path>
          <path d="M20 7V4h-3"></path><path d="M20 17v3h-3"></path>
        </svg>
        Iniciar verificación
      </button>

      <div class="progress-bar-wrapper fade-in" *ngIf="scanState === 'scanning'">
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>
  </section>
</main>
